<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#1e1b4b"/>
  
  <!-- DAG Nodes - 4 stages: Research, Analysis, Writing, Critique -->
  <!-- Node 1: Research (indigo) -->
  <circle cx="8" cy="16" r="4" fill="#4f46e5" opacity="0.9">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <text x="8" y="18" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" fill="white" text-anchor="middle">1</text>
  
  <!-- Node 2: Analysis (cyan) -->
  <circle cx="16" cy="8" r="4" fill="#06b6d4" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <text x="16" y="10" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" fill="white" text-anchor="middle">2</text>
  
  <!-- Node 3: Writing (emerald) -->
  <circle cx="24" cy="16" r="4" fill="#10b981" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <text x="24" y="18" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" fill="white" text-anchor="middle">3</text>
  
  <!-- Node 4: Devil's Advocate (amber) -->
  <circle cx="16" cy="24" r="4" fill="#f59e0b" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <text x="16" y="26" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" fill="white" text-anchor="middle">4</text>
  
  <!-- Edges connecting nodes -->
  <line x1="11" y1="14" x2="13.5" y2="10.5" stroke="#4f46e5" stroke-width="1.5" opacity="0.6">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.2s"/>
  </line>
  <line x1="18" y1="11" x2="21" y2="13.5" stroke="#06b6d4" stroke-width="1.5" opacity="0.6">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.7s"/>
  </line>
  <line x1="20.5" y1="18" x2="17.5" y2="21" stroke="#10b981" stroke-width="1.5" opacity="0.6">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1.2s"/>
  </line>
  <line x1="13.5" y1="21" x2="10.5" y2="18" stroke="#f59e0b" stroke-width="1.5" opacity="0.6">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1.7s"/>
  </line>
  
  <!-- Center pulse -->
  <circle cx="16" cy="16" r="2" fill="#ffffff" opacity="0.3">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>